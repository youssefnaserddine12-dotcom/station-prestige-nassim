<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Station Prestige Nassim— Gestion</title>
<style>
:root{--y:#ffd500;--r:#dd1d21;--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#e3e6ec;--ok:#12805c;--warn:#b54708;--bad:#c01048}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{background:var(--r);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .logo{background:var(--y);color:var(--r);font-weight:800;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
header h1{font-size:16px;margin:0;flex:1}
header small{opacity:.85;display:block;font-weight:400}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);padding:6px 8px;position:sticky;top:0;z-index:5}
nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font:inherit;color:var(--mut);white-space:nowrap;cursor:pointer}
nav button.on{background:var(--y);color:#111;font-weight:700}
main{padding:12px;max-width:1400px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .l{color:var(--mut);font-size:12px}.kpi .v{font-size:19px;font-weight:800;margin-top:4px}
.kpi .s{font-size:11px;color:var(--mut);margin-top:2px}
h2{font-size:15px;margin:14px 0 8px}
.tw{overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:right}
th{background:#fafafa;position:sticky;top:0;z-index:2;font-weight:700;text-align:center}
td.t{text-align:left}
tr.tot td{background:#fff8cc;font-weight:800;position:sticky;bottom:0}
tr:hover td{background:#fffdf0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select,input{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:#fff}
button.b{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer}
button.p{background:var(--r);border-color:var(--r);color:#fff}
button.sm{padding:2px 8px;font-size:12px}
.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}.bad{color:var(--bad);font-weight:700}
.chart{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;overflow:auto}
.note{background:#fff8e6;border:1px solid #f5d98a;border-radius:10px;padding:10px;margin:10px 0;line-height:1.7}
.note.g{background:#ecfdf3;border-color:#a6e9c4}
.drop{display:block;border:2px dashed var(--r);border-radius:14px;padding:22px;text-align:center;background:#fff;cursor:pointer;position:relative}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop.over{background:#fff3f3}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:14px;width:min(640px,100%);max-height:92vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.grid label{font-size:11.5px;color:var(--mut);display:block}
.grid input{width:100%}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media print{nav,.bar,header button{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <h1>Station Prestige Nassim<small>Vivo Energy Maroc — Gestion de la station · <span id="hsrc"></span></small></h1>
  <button class="b" onclick="TAB='imp';render()">📥 Importer Excel</button>
  <button class="b" onclick="exportBackup()">💾 Sauvegarde</button>
  <button class="b" onclick="document.getElementById('imp').click()">📂 Restaurer sauvegarde</button>
  <input id="imp" type="file" style="display:none" onchange="importBackup(this)">
</header>
<nav id="nav"></nav>
<main id="view"></main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

/* ---------- agrégation ---------- */
const NUMK=['ssp','vssp','fsvd','vpd','ca_carb','ca_lub','ca_total','baf','sntl','tpe','taqati','shell','chq','dep','especes','vers_carb','vers_lub'];
function agg(m){const o={n:0};NUMK.forEach(k=>o[k]=0);
  db.days.forEach(r=>{if(m==null||r.month===m){o.n++;NUMK.forEach(k=>o[k]+=r[k]||0)}});return o}
function pagg(m){const o={ssp:0,vssp:0,fsvd:0,vpd:0,cumul:0,value:0,n:0};
  db.purchases.forEach(p=>{if(m==null||p.month===m){o.n++;['ssp','vssp','fsvd','vpd','cumul','value'].forEach(k=>o[k]+=p[k]||0)}});return o}
const litres=a=>a.ssp+a.vssp+a.fsvd+a.vpd;
const activeMonths=()=>[...new Set(db.days.map(d=>d.month))].sort((a,b)=>a-b);
function stockCalc(m){
  const ms=activeMonths(),start=ms[0]||1,res={};
  PR.forEach(([k])=>{
    const E=db.ref.stock&&db.ref.stock[start];let init=E&&E.init?E.init[k]||0:0;
    for(let i=start;i<=m;i++){
      const a=pagg(i)[k],v=agg(i)[k],theo=init+a-v;
      if(i===m){const phys=db.phys[m+'|'+k];res[k]={init,achats:a,ventes:v,theo,phys:phys==null?null:phys,ecart:phys==null?null:phys-theo}}
      init=theo}
  });return res}

function barChart(){
  const ms=[];for(let m=1;m<=12;m++)ms.push([m,agg(m)]);const mx=Math.max(1,...ms.map(x=>x[1].ca_total));
  const W=720,H=240,pad=30,bw=(W-pad*2)/12;let s=`<svg viewBox="0 0 ${W} ${H}" style="min-width:560px;width:100%">`;

function parseDashboard(rows){

    const mi=MNN.indexOf(c0);

    if(c0.startsWith('TOTALANN')&&sect==='m'){const v=r.slice(1).filter(isNum);if(v.length>=3)margin={ca:v[0],cout:v[1],marge:v[2]}}});

function parseWorkbook(wb){

    const dash=rows.some(r=>norm(r[0])==='MOIS'&&norm(r[1]).startsWith('QTE'));
    if(dash){P.dash=parseDashboard(rows);return}
    const j=parseJournal(n,rows);
    if(typeof j==='string'||!j){if(rows.some(r=>r.some(c=>c!=null))){const nf=noValueFormulas(wb.Sheets[n]);P.skipped.push(n+' — '+(j||'format non reconnu')+(nf?` ; ${nf} formule(s) sans valeur calculée : ouvrez le fichier dans Excel, enregistrez-le, puis réimportez`:''))}return}
    if(P.months[j.month])P.errors.push(`Le mois ${MN[j.month-1]} apparaît dans deux feuilles (« ${P.months[j.month].name} » et « ${n} ») : la dernière est retenue.`);
    P.months[j.month]=j});
  const ys=Object.values(P.months).map(m=>m.year);P.year=ys.length?+modeOf(ys):null;

function checkMonth(j){ // contrôles internes d'un mois importé
  const rep={sum:[],daily:0,gaps:[],dupes:[],dates:[],stockBad:[]};
  const s={};NUMK.forEach(k=>s[k]=0);j.days.forEach(d=>NUMK.forEach(k=>s[k]+=d[k]||0));
  if(j.tot)SKEYS.forEach((k,i)=>{const d=s[k]-j.tot[i];if(Math.abs(d)>0.011)rep.sum.push([k,j.tot[i],s[k],d])});
  j.days.forEach(r=>{
    if(Math.abs(r.ca_total-(r.ca_carb+r.ca_lub))>0.011)rep.daily++;
    if(Math.abs(r.especes-(r.ca_total-r.baf-r.sntl-r.tpe-r.taqati-r.shell-r.chq-r.dep))>0.02)rep.daily++;
    if(r.p_ssp!=null&&Math.abs(r.ssp*r.p_ssp+r.vssp*r.p_vssp+r.fsvd*r.p_fsvd+r.vpd*r.p_vpd-r.ca_carb)>0.05)rep.daily++});
  const dim=new Date(Date.UTC(j.year,j.month,0)).getUTCDate();
  for(let d=1;d<=dim;d++){const c=j.days.filter(x=>+x.date.slice(8)===d).length;if(c===0)rep.gaps.push(d);if(c>1)rep.dupes.push(d)}

  if(j.stock.ventes)PR.forEach(([p])=>{if(Math.abs((j.stock.ventes[p]||0)-s[p])>0.5)rep.stockBad.push(`Ventes ${p} : tableau stock ${f0(j.stock.ventes[p])} ≠ journal ${f0(s[p])}`)});

function vImp(){

  const dz=$('#drop');if(dz){['dragover','dragenter'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('over')}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('over')}));dz.addEventListener('drop',ev=>{if(ev.dataTransfer.files[0])routeFile(ev.dataTransfer.files[0])})}}
function readXlsx(f){if(!f)return;IMPERR='';PEND=null;
  const fail=e=>{IMPERR='Lecture impossible : '+(e&&e.message?e.message:e)+'. Vérifiez que c\'est bien un fichier Excel (.xlsx) non protégé par mot de passe.';render()};
  if(typeof XLSX==='undefined')return fail('bibliothèque de lecture Excel indisponible');

  r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});const P=parseWorkbook(wb);P.file=f.name;P.sheetNames=wb.SheetNames;

function pendHTML(){
  const P=PEND,ms=Object.keys(P.months).map(Number).sort((a,b)=>a-b);

function commitImport(){
